# Blueprint do Render: cria a API (FastAPI) e um PostgreSQL gratuito.
# O site (docs/) vai para o Netlify: veja netlify.toml e o README.
databases:
  - name: dialoga-db
    plan: free   # o plano gratuito expira em 30 dias e nao tem backup: confira no painel do Render

services:
  - type: web
    name: dialoga-api
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    # UM unico processo: o estado fica em memoria e e gravado no PostgreSQL a cada alteracao
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DATABASE_URL
        fromDatabase:
          name: dialoga-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false          # o Render pede o valor ao criar o Blueprint
      - key: CORS_ORIGINS
        sync: false          # primeiro use *, depois troque pelo endereco do Netlify
      - key: CONTATO_PRIVACIDADE
        sync: false          # e-mail para pedidos sobre dados (LGPD)
      - key: GEMINI_PLANO_PAGO
        value: "0"           # mude para 1 so quando a chave for de um projeto com faturamento ativo
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_MODEL_RESERVA
        value: gemini-3.8-flash
      - key: CONTROLADOR
        value: Equipe do projeto Dialoga+ (TCC FAMETRO)
      - key: RETENCAO_DIAS
        value: "180"
      - key: ANALISES_POR_HORA
        value: "20"
      - key: DESBLOQUEIO
        value: primeiro
      - key: ENABLE_DOCS
        value: "0"
